name: CICD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: #

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn package --file pom.xml

    - uses: actions/upload-artifact@v4
      with:
        name: Boardgame
        path: target/*.jar

    - name: Install Trivy
      run: |
        wget -q https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
        tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
        sudo mv trivy /usr/local/bin/trivy
        rm trivy_0.74.0_Linux-64bit.tar.gz
        trivy --version
    
    - name: Trivy FS Scan
      run: |
        trivy fs --format table -o trivy-fs-report.html .
        
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Trivy DB
      uses: actions/cache@v4
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ github.run_id }}
        restore-keys: trivy-db-

    - name: Build Docker Image
      run: |
        docker build -t ankittomar0207/boardgame:latest .

    - name: Trivy Image Scan
      run: |
        trivy image --format table -o trivy-image-report.html ankittomar0207/board:latest

    - name: Login to Docker Hub
      uses: docker/login-action@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker Image
      run: |
          docker push ankittomar0207/boardgame:latest
          
    
